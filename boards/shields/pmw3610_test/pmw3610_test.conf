# Standalone, USB-powered sensor bring-up.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_BATTERY_REPORTING=n

# Keep nice!nano VCC enabled, independent of any saved keyboard settings.
CONFIG_ZMK_EXT_POWER=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NONE=y
CONFIG_NVS=n

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y

# Allow nice!nano's switched VCC to settle before the sensor's async init.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# The zmk-usb-logging snippet supplies the USB CDC ACM console.
# Log initialization/self-test failures and live x/y deltas.
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_PMW3610_LOG_LEVEL_DBG=y

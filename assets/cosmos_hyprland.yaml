# Current shortcuts, not firmware layers. See ../HYPRLAND.md for gestures and host scope.
layout:
  zmk_keyboard: corne
  layout_name: foostan_corne_6col_layout
draw_config:
  combo_h: 34
  footer_text: "Center: action | Top: add Shift | Bottom: Base key | D: Deck | Z: zuffie | See HYPRLAND.md"
  svg_extra_style: |
    svg.keymap { font-size: 12px; }
    text.key.hold { font-size: 9px; fill: #667085; }
    text.key.shifted { font-size: 9px; fill: #925600; }
    text.combo.shifted { fill: #925600; }
    rect.idle { fill: #ffffff; stroke: #e5e7eb; }
    text.idle { fill: #98a2b3; }
    rect.deck { fill: #e0f2fe; }
    rect.zuffie { fill: #ede9fe; }

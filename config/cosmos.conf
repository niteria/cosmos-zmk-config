# Cosmos split keyboard configuration
# Split settings are configured in Kconfig.defconfig
# ZMK loads this shared config for both cosmos_left and cosmos_right.

# BLE experimental settings for better compatibility
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y

# Enable battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable pointing device
CONFIG_ZMK_POINTING=y

# Keep per-event logging out of the keyboard and pointing hot paths.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_INF=y

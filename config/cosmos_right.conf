# PMW3610 and the three direct-wired mouse buttons live on the central half.
CONFIG_PMW3610=y
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_ZMK_EXT_POWER=y

# A dedicated CDC ACM console, separate from the Studio USB serial interface.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_PMW3610_LOG_LEVEL_INF=y
